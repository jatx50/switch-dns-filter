name: Update filter

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download emummc.txt
        run: |
          curl -fsSL --retry 3 \
            https://nintendohomebrew.com/assets/emummc.txt \
            -o emummc.txt

      - name: Convert to AdGuard rules
        run: |
          awk -f convert.awk emummc.txt > nswitch.tmp
          test "$(wc -l < nswitch.tmp)" -ge 30
          mv nswitch.tmp nswitch-emummc.txt

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898299+github-actions[bot]@users.noreply.github.com"
          git add emummc.txt nswitch-emummc.txt
          if git diff --cached --quiet; then
            if [ "$(date -u +%d)" != "01" ]; then
              echo "No change."
              exit 0
            fi
            msg="Record monthly keepalive run"
          else
            msg="Update NSWITCH rules from upstream emummc.txt"
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > last-run.txt
          git add last-run.txt
          git commit -m "$msg"
          git push
